<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover: tablette çentik/yuvarlak köşe altına da boya.
         Yakınlaştırma KISITLANMADI: `user-scalable=no` yaygın bir kalıptır
         ama görme zorluğu olan kullanıcıdan sayfayı büyütme imkânını alır. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Ana ekrana eklendiğinde tarayıcı çerçevesi olmadan açılır. Kullanım
         senaryosu bunu istiyor: bilgisayar açık kalıyor, Jarvis tabletten
         tam ekran bir uygulama gibi kullanılıyor. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#04030c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />

    <title>Jarvis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
