[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "Yerel Jarvis kişisel asistanı için modüler FastAPI temeli."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jarvis Project" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "psutil>=6.0,<8.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  # Windows'ta IANA saat dilimi veritabanı yoktur ve `zoneinfo` onsuz
  # "Europe/Istanbul" gibi bir adı çözemez. Saat dilimi ayarı olmadan
  # get_time/get_date bulutta yanlış saati verir, bu yüzden veri paketi
  # isteğe bağlı değil zorunlu bir bağımlılıktır.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.13,<2.0",
  "pre-commit>=4.0,<5.0",
]

[project.scripts]
jarvis = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# `.venv` gibi klasörler zaten varsayılan olarak dışlanır; burada projeye
# özgü ek bir dışlama yok.
extend-exclude = ["frontend", "design"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle hataları
  "F",    # pyflakes
  "W",    # pycodestyle uyarıları
  "I",    # import sıralaması (isort)
  "B",    # bugbear: yaygın mantık hataları
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "SIM",  # basitleştirmeler
  "RUF",  # ruff'a özgü kurallar
  "PIE",  # gereksiz kod
  "PERF", # performans
]
ignore = [
  # Türkçe dokümantasyon ve kullanıcıya dönük metinler Kiril/Yunan benzeri
  # karakterler içerir; bu kural onları yanlışlıkla "karışık" sayar.
  "RUF001",
  "RUF002",
  "RUF003",
  # Uzun satırlar biçimlendirici tarafından zaten sarılır; kalan uzunluklar
  # bölünemeyen URL'ler, uzun dize sabitleri ve Türkçe düzyazıdır.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI, bağımlılık enjeksiyonunu fonksiyon varsayılanlarındaki
# `Query(...)`/`Depends(...)` çağrılarıyla ifade eder; B008 burada
# kasıtlı bir kalıba işaret eder, hataya değil.
"app/api/**" = ["B008"]
# Testlerde kasıtlı olarak özel üyelere ve `dict()` kurucularına erişilir;
# ayrıca kısa yardımcı fonksiyonlarda dönüş tipleri zorunlu değildir.
"tests/**" = ["C408", "SLF001", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# Kademeli sıkılık. Hedef: her fonksiyonun imzası tiplidir ve çağrılar
# denetlenir; ama üçüncü taraf (pydantic/fastapi/starlette) iç tiplerinin
# çözümlenemediği yerlerde gürültü üretilmez.
#
# `strict = true` bilinçli olarak AÇILMADI: FastAPI bağımlılık yardımcıları
# `getattr` üzerinden `Any` döndürdüğü için `warn_return_any` tek başına
# ~20 yanlış-pozitif üretirdi. Bu kalıntı, ilgili uçlara açık tip daraltma
# eklendikçe kademeli olarak kapatılacaktır.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
include = ["app/prompts/*.txt"]
