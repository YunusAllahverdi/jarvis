# Commit öncesi yerel kontroller; CI'daki (.github/workflows/ci.yml)
# kontrollerin aynısını erkenden çalıştırır.
#
# Kurulum (bir kez):
#   pip install pre-commit && pre-commit install
#
# Kancalar kendi izole ortamlarını kurar, dolayısıyla yerel bir sanal
# ortamı etkinleştirmeye gerek yoktur. Sürümler bilinçli olarak sabitlendi:
# `@main` gibi hareketli bir ref, habersiz bir kural değişikliğiyle tüm
# commit'leri kırabilirdi.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        name: ruff (lint + otomatik düzeltme)
        args: [--fix]
      - id: ruff-format
        name: ruff (biçimlendirme)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        name: mypy (app/)
        # mypy ayarları pyproject.toml'dan okunur; kanca yalnızca hedefi
        # belirtir. `files` ayarı orada `app` olarak sabitlendiği için
        # geçirilen dosya listesi kullanılmaz.
        pass_filenames: false
        args: [app]
        additional_dependencies:
          - pydantic>=2.9
          - fastapi>=0.115
          - pydantic-settings>=2.5
          - httpx>=0.27
          - psutil>=6.0
          - uvicorn>=0.30

  - repo: local
    hooks:
      - id: pytest
        name: pytest (tüm takım)
        entry: pytest -q
        language: system
        pass_filenames: false
        types: [python]
        # Takımın tamamı ~17 saniye sürer; her commit'i yavaşlatmamak için
        # yalnızca push öncesinde çalıştırılır.
        stages: [pre-push]
